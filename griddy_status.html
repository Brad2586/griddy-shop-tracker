<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griddy Shop Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 90%;
        }
        .emoji { font-size: 64px; margin-bottom: 20px; }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status {
            font-size: 48px;
            font-weight: 900;
            color: #e74c3c;
            margin: 20px 0;
            text-shadow: 0 0 30px #e74c3c66;
        }
        .message {
            font-size: 18px;
            color: #b0b0c0;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .timestamp {
            font-size: 13px;
            color: #555570;
            border-top: 1px solid #2a2a40;
            padding-top: 20px;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">&#x274C;</div>
        <h1>Griddy Shop Tracker</h1>
        <div class="status">Not Currently Available</div>
        <p class="message">The Griddy emote is not in today's Fortnite Item Shop.</p>
        <p class="timestamp">Last checked: August 17, 2026 at 08:00 PM<br>
        <a href="https://fortnite.gg/shop" target="_blank">View Fortnite Item Shop</a></p>
    </div>
</body>
</html>
